name: "tests"

on:
  push:
    branches:
    - "main"

permissions:
  contents: "read"

jobs:
  test:
    name: "test"
    runs-on: "ubuntu-latest"
    steps:
    - uses: "actions/checkout@v6"
    - uses: "actions/setup-go@v6"
      with:
        go-version: "1.26"
    - name: "run go test"
      run: "go test ./..."
